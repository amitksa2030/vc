mkdir -p .github/workflows && echo 'Name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: '\''temurin'\''
          java-version: '\''17'\''

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk' > .github/workflows/build-apk.yml && git add .github/workflows/build-apk.yml && git commit -m "Add automated Android build workflow" && git push origin main
